---
layout: default
title: Recordings
---
<section class="catalogue-heading">
  <h1 aria-label="A catalog of refusal"><span>a catalog of</span><span>refusal</span></h1>
</section>

<script>
(function () {
  function stretchTitle() {
    var h1 = document.querySelector('.catalogue-heading h1');
    if (!h1) return;
    var spans = h1.querySelectorAll('span');
    var available = h1.clientWidth;
    if (available < 10) return;
    spans.forEach(function (span) {
      // reset so we can measure natural width
      span.style.transform = 'none';
      var natural = span.scrollWidth;
      if (natural < 1) return;
      var scale = available / natural;
      span.style.transform = 'scaleX(' + scale + ')';
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', stretchTitle);
  } else {
    stretchTitle();
  }
  window.addEventListener('resize', stretchTitle);
  // fonts may still be loading
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(stretchTitle);
  }
})();
</script>
{% include header.html %}
<div class="filter-bar" id="filter-panel" data-filter-bar hidden>
  <label><span>Medium</span><select data-filter="medium"><option value="">All media</option></select></label>
  <label><span>Decade</span><select data-filter="decade"><option value="">All decades</option></select></label>
  <label><span>Country</span><select data-filter="country"><option value="">All places</option></select></label>
  <label><span>Tag</span><select data-filter="tag"><option value="">All tags</option></select></label>
  <label><span>Sort</span><select data-sort>
    <option value="number-desc" selected>Newest number first</option>
    <option value="number-asc">Oldest number first</option>
    <option value="title-asc">Title A–Z</option>
    <option value="title-desc">Title Z–A</option>
  </select></label>
  <button type="button" class="clear-filters" data-clear-filters>Clear filters</button>
  <span class="filter-count" data-filter-count>{{ site.recordings.size }} recordings</span>
</div>
{% assign recordings = site.recordings | sort: "name" | reverse %}
<div class="catalogue-list" data-catalogue-list>
  {% for post in recordings %}{% include post-row.html post=post %}{% endfor %}
</div>
<script>
(function () {
  var bar = document.querySelector("[data-filter-bar]");
  var list = document.querySelector("[data-catalogue-list]");
  var toggle = document.querySelector("[data-filter-toggle]");
  if (!bar || !list) return;
  var rows = Array.prototype.slice.call(list.querySelectorAll("[data-catalogue-row]"));
  var selects = Array.prototype.slice.call(bar.querySelectorAll("select[data-filter]"));
  var sortSelect = bar.querySelector("[data-sort]");
  var count = bar.querySelector("[data-filter-count]");
  if (toggle) toggle.addEventListener("click", function () {
    var open = toggle.getAttribute("aria-expanded") === "true";
    toggle.setAttribute("aria-expanded", String(!open));
    bar.hidden = open;
  });
  function valuesFor(key) {
    var values = {};
    rows.forEach(function (row) {
      var raw = row.getAttribute("data-" + key) || "";
      (key === "tag" ? raw.split("|") : [raw]).forEach(function (value) {
        value = value.trim();
        if (value) values[value] = true;
      });
    });
    return Object.keys(values).sort();
  }
  function label(value) { return value.replace(/\b\w/g, function (c) { return c.toUpperCase(); }); }
  selects.forEach(function (select) {
    var key = select.getAttribute("data-filter");
    var values = key === "decade" ? (function () {
      var years = {};
      rows.forEach(function (row) {
        var match = (row.getAttribute("data-when") || "").match(/(?:18|19|20)\d{2}/);
        if (match) years[Math.floor(Number(match[0]) / 10) * 10 + "s"] = true;
      });
      return Object.keys(years).sort();
    }()) : valuesFor(key);
    values.forEach(function (value) {
      var option = document.createElement("option");
      option.value = value;
      option.textContent = label(value);
      select.appendChild(option);
    });
    select.addEventListener("change", apply);
  });
  function sortRows() {
    var mode = sortSelect ? sortSelect.value : "number-desc";
    rows.sort(function (a, b) {
      if (mode.indexOf("title") === 0) {
        var comparison = (a.getAttribute("data-title") || "").localeCompare(b.getAttribute("data-title") || "");
        return mode === "title-desc" ? -comparison : comparison;
      }
      var delta = Number(a.getAttribute("data-number")) - Number(b.getAttribute("data-number"));
      return mode === "number-asc" ? delta : -delta;
    });
    rows.forEach(function (row) { list.appendChild(row); });
  }
  function apply() {
    var active = {};
    selects.forEach(function (select) { active[select.getAttribute("data-filter")] = select.value; });
    var visible = 0;
    rows.forEach(function (row) {
      var match = true;
      if (active.medium && row.getAttribute("data-medium") !== active.medium) match = false;
      if (active.country && row.getAttribute("data-country") !== active.country) match = false;
      if (active.tag && (row.getAttribute("data-tags") || "").split("|").indexOf(active.tag) === -1) match = false;
      if (active.decade) {
        var year = (row.getAttribute("data-when") || "").match(/(?:18|19|20)\d{2}/);
        if (!year || Math.floor(Number(year[0]) / 10) * 10 + "s" !== active.decade) match = false;
      }
      row.hidden = !match;
      if (match) visible++;
    });
    if (count) count.textContent = visible + " of " + rows.length + " recordings";
  }
  if (sortSelect) sortSelect.addEventListener("change", function () { sortRows(); });
  bar.querySelector("[data-clear-filters]").addEventListener("click", function () {
    selects.forEach(function (select) { select.value = ""; });
    apply();
  });
  sortRows();
  apply();
}());
</script>
