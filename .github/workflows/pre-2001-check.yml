name: Enforce pre-2001 recording cutoff

on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'scripts/check_pre_2001.py'
      - '.github/workflows/pre-2001-check.yml'
  pull_request:
    paths:
      - 'posts/**'
      - 'scripts/check_pre_2001.py'
      - '.github/workflows/pre-2001-check.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml
      - run: python scripts/check_pre_2001.py
