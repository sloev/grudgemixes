name: Find and download real post images
# Re-run the full archival image audit after catalogue access cleanup.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fill-post-images.yml'
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: write

concurrency:
  group: fill-post-images
  cancel-in-progress: true

jobs:
  images:
    timeout-minutes: 30
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Find and download genuine images from linked sources and open collections
        run: |
          python -m pip install requests pyyaml beautifulsoup4 pillow
          python <<'PY'
          import html, json, re, time, unicodedata
          from pathlib import Path
          from urllib.parse import urljoin, urlparse, quote
          import requests, yaml
          from bs4 import BeautifulSoup
          from PIL import Image
          from io import BytesIO

          ROOT, MEDIA = Path('.'), Path('media')
          MEDIA.mkdir(exist_ok=True)
          session = requests.Session()
          session.headers.update({'User-Agent': 'Mozilla/5.0 (compatible; GrudgeMixesImageResearch/1.0; +https://github.com/sloev/grudgemixes)'})
          IMAGE_TYPES = {'image/jpeg': '.jpg', 'image/png': '.png', 'image/webp': '.webp', 'image/tiff': '.tif'}
          STOP = set('the and for with from into this that what when where who song songs record records recording recordings album albums cassette tape 78rpm 78 rpm disc side a b original self titled'.split())

          def clean(s):
              return re.sub(r'<[^>]+>', ' ', html.unescape(str(s or ''))).strip()

          def tokens(s):
              vals = re.findall(r'[a-z0-9]{3,}', unicodedata.normalize('NFKD', str(s)).encode('ascii', 'ignore').decode().lower())
              return {x for x in vals if x not in STOP and not x.isdigit()}

          def slug(s):
              s = unicodedata.normalize('NFKD', s).encode('ascii', 'ignore').decode().lower()
              return re.sub(r'[^a-z0-9]+', '-', s).strip('-')[:85] or 'post'

          def get(url, timeout=8):
              for attempt in range(2):
                  try:
                      r = session.get(url, timeout=timeout, allow_redirects=True)
                      if r.status_code == 429 and attempt == 0:
                          time.sleep(2)
                          continue
                      r.raise_for_status()
                      return r
                  except Exception as e:
                      if attempt == 0 and getattr(getattr(e, 'response', None), 'status_code', 0) in (429, 500, 502, 503, 504):
                          time.sleep(2)
                          continue
                      print(f'FETCH ERROR {url}: {e}')
                      return None
              return None

          def image_bytes(url):
              if not url or not url.startswith(('http://', 'https://')):
                  return None
              r = get(url, 6)
              if not r:
                  return None
              mime = r.headers.get('Content-Type', '').split(';')[0].lower()
              if mime not in IMAGE_TYPES or len(r.content) < 8000:
                  return None
              try:
                  im = Image.open(BytesIO(r.content))
                  im.verify()
                  im = Image.open(BytesIO(r.content))
                  w, h = im.size
                  if w < 300 or h < 200 or w / max(h, 1) > 5.5 or h / max(w, 1) > 5.5:
                      return None
              except Exception:
                  return None
              return r.content, IMAGE_TYPES[mime]

          def relevant(query_tokens, label):
              found = query_tokens & tokens(label)
              return len(found) >= 2 and len(found) / max(1, len(query_tokens)) >= 0.30

          def from_linked_sources(urls, query):
              for page_url in urls[:3]:
                  if not page_url.startswith(('http://', 'https://')) or page_url.lower().split('?', 1)[0].endswith('.pdf'):
                      continue
                  parsed = urlparse(page_url)
                  if not parsed.hostname or parsed.hostname.endswith(('youtube.com', 'youtu.be', 'spotify.com', 'soundcloud.com')):
                      continue
                  page = get(page_url)
                  if not page:
                      continue
                  ctype = page.headers.get('Content-Type', '').lower()
                  if ctype.startswith('image/'):
                      if not relevant(tokens(query), urlparse(page.url).path):
                          continue
                      found = image_bytes(page.url)
                      if found:
                          return found[0], found[1], urlparse(page.url).path, page.url
                      continue
                  if 'html' not in ctype and not page.text.lstrip().startswith('<'):
                      continue
                  soup = BeautifulSoup(page.text[:2500000], 'html.parser')
                  page_title = clean((soup.title.string if soup.title else '') or '')
                  meta_title = soup.find('meta', attrs={'property': 'og:title'})
                  meta_desc = soup.find('meta', attrs={'name': 'description'}) or soup.find('meta', attrs={'property': 'og:description'})
                  page_context = ' '.join([page_title, clean(meta_title.get('content') if meta_title else ''), clean(meta_desc.get('content') if meta_desc else '')])
                  if not relevant(tokens(query), page_context):
                      continue
                  candidates = []
                  for attr in ('property', 'name', 'itemprop'):
                      for key in ('og:image', 'twitter:image', 'image'):
                          tag = soup.find('meta', attrs={attr: key})
                          if tag and tag.get('content'):
                              candidates.append((tag['content'], clean(tag.get('alt') or '')))
                  for tag in soup.find_all('img'):
                      src = tag.get('src') or tag.get('data-src') or tag.get('data-original')
                      if src:
                          alt = clean(tag.get('alt') or '')
                          low = (src + ' ' + alt).lower()
                          if not any(x in low for x in ('logo', 'icon', 'avatar', 'pixel', 'spacer', 'flag')):
                              candidates.append((src, alt))
                  for raw, alt in candidates[:3]:
                      img_url = urljoin(page.url, raw.strip())
                      if alt and not relevant(tokens(query), alt + ' ' + img_url):
                          continue
                      found = image_bytes(img_url)
                      if found:
                          return found[0], found[1], page_title or alt or 'Relevant source image', page.url
              return None

          def loc_search(query):
              params = {'q': query, 'fo': 'json', 'c': 10}
              try:
                  data = get('https://www.loc.gov/photos/?' + requests.compat.urlencode(params))
                  if not data:
                      return None
                  results = data.json().get('results', [])
                  qt = tokens(query)
                  for item in results[:3]:
                      label = clean(item.get('title', ''))
                      score = len(qt & tokens(label)) / max(1, len(qt))
                      if score < max(0.30, 2 / max(1, len(qt))):
                          continue
                      imgs = item.get('image_url') or []
                      if isinstance(imgs, str):
                          imgs = [imgs]
                      for img in imgs[:2]:
                          found = image_bytes(img)
                          if found:
                              return found[0], found[1], clean(item.get('title')), item.get('id', 'https://www.loc.gov/')
              except Exception as e:
                  print(f'LOC ERROR {query}: {e}')
              return None

          def commons_search(query):
              params = {
                  'action': 'query',
                  'generator': 'search',
                  'gsrsearch': query,
                  'gsrnamespace': 6,
                  'gsrlimit': 12,
                  'prop': 'imageinfo',
                  'iiprop': 'url|extmetadata',
                  'iiurlwidth': 1200,
                  'format': 'json'
              }
              try:
                  r = get('https://commons.wikimedia.org/w/api.php?' + requests.compat.urlencode(params))
                  if not r:
                      return None
                  pages = r.json().get('query', {}).get('pages', {})
                  qt = tokens(query)
                  for item in list(pages.values())[:4]:
                      label = clean(item.get('title', ''))
                      if not relevant(qt, label):
                          continue
                      info = (item.get('imageinfo') or [{}])[0]
                      img = info.get('thumburl') or info.get('url')
                      found = image_bytes(img)
                      if found:
                          return found[0], found[1], label, img
              except Exception as e:
                  print(f'COMMONS ERROR {query}: {e}')
              return None

          def archive_search(query):
              words = list(tokens(query))
              if not words:
                  return None
              # Query exact title terms first; image records only.
              terms = ' AND '.join('title:' + quote(w) for w in words[:5])
              params = {'q': f'mediatype:image AND ({terms})', 'fl[]': ['identifier', 'title'], 'rows': 6, 'page': 1, 'output': 'json'}
              try:
                  r = get('https://archive.org/advancedsearch.php?' + requests.compat.urlencode(params, doseq=True))
                  if not r:
                      return None
                  docs = r.json().get('response', {}).get('docs', [])
                  qt = set(words)
                  for doc in docs[:1]:
                      ident, label = doc.get('identifier'), clean(doc.get('title', ''))
                      if not ident:
                          continue
                      score = len(qt & tokens(label)) / max(1, len(qt))
                      if score < max(0.30, 2 / max(1, len(qt))):
                          continue
                      meta_r = get('https://archive.org/metadata/' + quote(ident, safe=''))
                      if not meta_r:
                          continue
                      files = meta_r.json().get('files', [])
                      files = sorted(files, key=lambda x: (0 if x.get('name', '').lower().endswith(('.jpg', '.jpeg', '.png')) else 1, 0 if 'cover' in x.get('name', '').lower() else 1))
                      for f in files[:1]:
                          name = f.get('name', '')
                          if not name.lower().endswith(('.jpg', '.jpeg', '.png', '.webp')):
                              continue
                          found = image_bytes('https://archive.org/download/' + quote(ident, safe='') + '/' + quote(name, safe='/'))
                          if found:
                              return found[0], found[1], label, 'https://archive.org/details/' + ident
              except Exception as e:
                  print(f'INTERNET ARCHIVE ERROR {query}: {e}')
              return None

          def met_search(query):
              try:
                  r = get('https://collectionapi.metmuseum.org/public/collection/v1/search?' + requests.compat.urlencode({'q': query, 'hasImages': 'true'}))
                  if not r:
                      return None
                  ids = (r.json().get('objectIDs') or [])[:6]
                  qt = tokens(query)
                  for ident in ids:
                      obj_r = get(f'https://collectionapi.metmuseum.org/public/collection/v1/objects/{ident}')
                      if not obj_r:
                          continue
                      obj = obj_r.json()
                      label = clean(obj.get('title', ''))
                      score = len(qt & tokens(label)) / max(1, len(qt))
                      if score < max(0.30, 2 / max(1, len(qt))):
                          continue
                      img = obj.get('primaryImage') or obj.get('primaryImageSmall')
                      found = image_bytes(img)
                      if found:
                          return found[0], found[1], label, obj.get('objectURL', 'https://www.metmuseum.org/')
              except Exception as e:
                  print(f'MET ERROR {query}: {e}')
              return None

          def collect_links(front, body):
              links = []
              def walk(v):
                  if isinstance(v, str):
                      links.extend(re.findall(r'https?://[^\s\]\)\\"\']+', v))
                  elif isinstance(v, list):
                      for x in v: walk(x)
                  elif isinstance(v, dict):
                      for x in v.values(): walk(x)
              walk({k: v for k, v in front.items() if k != 'images'})
              links.extend(re.findall(r'https?://[^\s\]\)\\"\']+', body))
              out = []
              for x in links:
                  x = x.rstrip('.,;')
                  if x not in out:
                      out.append(x)
              return out

          posts = sorted((ROOT / 'posts').rglob('*.md'))
          downloaded, missing = 0, []
          for index, post in enumerate(posts, 1):
              raw = post.read_text(encoding='utf-8')
              match = re.match(r'\A---\s*\n(.*?)\n---\s*\n', raw, re.S)
              if not match:
                  continue
              front = yaml.safe_load(match.group(1)) or {}
              images = front.get('images') or []
              if isinstance(images, str):
                  images = [images]
              current = str(images[0]) if images else ''
              current_path = current.split('|', 1)[0].strip()
              title = str(front.get('title') or post.stem)
              who = str(front.get('who') or '')
              what = str(front.get('what') or '')
              query = ' '.join(x for x in (title, who) if x)[:180]
              links = collect_links(front, raw[match.end():])
              result = from_linked_sources(links, query)
              if not result:
                  for q in [title[:120]]:
                      if q.strip():
                          result = loc_search(q)
                          if result: break
              if not result:
                  result = commons_search(title)
              if not result:
                  result = archive_search(title)
              if not result:
                  missing.append(str(post))
                  print(f'NO IMAGE FOUND: {post}')
                  # Remove any unverified old image reference; never retain an irrelevant or placeholder image.
                  if current_path:
                      front_text = re.sub(r'(?ms)^images:.*?(?=^[^ \t#][^\n]*:|\Z)', '', match.group(1))
                      updated = raw[:match.start(1)] + front_text.rstrip() + raw[match.end(1):]
                      post.write_text(updated, encoding='utf-8')
                      old_file = ROOT / current_path
                      if current_path.startswith('media/') and old_file.exists():
                          old_file.unlink()
                  continue

              content, ext, label, source_url = result
              number = post.name.split('-', 1)[0]
              filename = f'{number}-{slug(title)}{ext}'
              target = MEDIA / filename
              suffix = 2
              while target.exists():
                  filename = f'{number}-{slug(title)}-{suffix}{ext}'
                  target = MEDIA / filename
                  suffix += 1
              target.write_bytes(content)
              attribution = f'{clean(label)[:180]}; source: {source_url}'
              image_value = f'media/{filename} | {attribution}'.replace('"', "'").replace('\n', ' ')
              front_text = match.group(1)
              if re.search(r'(?m)^images:', front_text):
                  front_text = re.sub(r'(?ms)^images:.*?(?=^[^ \t#][^\n]*:|\Z)', 'images:\n  - "' + image_value + '"\n', front_text)
              else:
                  front_text += '\nimages:\n  - "' + image_value + '"'
              updated = raw[:match.start(1)] + front_text.rstrip() + raw[match.end(1):]
              post.write_text(updated, encoding='utf-8')
              if current_path.startswith('media/') and current_path.lower().endswith('.svg'):
                  old_file = ROOT / current_path
                  if old_file.exists():
                      old_file.unlink()
              downloaded += 1
              print(f'DOWNLOADED {filename} for {post} from {source_url}')
              time.sleep(0.35)

          print(f'POSTS SCANNED: {len(posts)}; REAL IMAGES DOWNLOADED: {downloaded}; POSTS STILL WITHOUT A REAL IMAGE: {len(missing)}')
          Path('missing-post-images.txt').write_text('\n'.join(missing) + ('\n' if missing else ''), encoding='utf-8')
          referenced = set()
          for post in posts:
              post_text = post.read_text(encoding='utf-8')
              referenced.update(re.findall(r'(?<![A-Za-z0-9_])media/[A-Za-z0-9_.-]+', post_text))
          for asset in MEDIA.iterdir():
              if asset.is_file() and asset.name != '.gitkeep' and str(asset) not in referenced:
                  asset.unlink()
                  print(f'REMOVED ORPHAN IMAGE: {asset}')
          PY
      - name: Commit all real images found and report any remaining gaps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts media missing-post-images.txt
          if ! git diff --cached --quiet; then
            git commit -m "Download real sourced images for posts [skip ci]"
            # Other commits may land while the archive search is running.
            # Rebase generated image changes before pushing so they are not lost.
            git pull --rebase origin main
            git push origin main
          fi
          if [ -f missing-post-images.txt ]; then
            echo "::warning::Some posts still need images; see missing-post-images.txt"
          fi
