name: Find and download real post images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fill-post-images.yml'
      - 'posts/**'
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: write

concurrency:
  group: fill-post-images
  cancel-in-progress: false

jobs:
  images:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Search Wikimedia Commons and download real photographs and archival images
        run: |
          python -m pip install requests pyyaml
          python <<'PY'
          import html, re, time, unicodedata
          from pathlib import Path
          import requests, yaml

          ROOT, MEDIA = Path('.'), Path('media')
          MEDIA.mkdir(exist_ok=True)
          API = 'https://commons.wikimedia.org/w/api.php'
          HEADERS = {'User-Agent': 'GrudgeMixesImageCollector/2.0 (GitHub Actions; contact via repository)'}
          ALLOWED = re.compile(r'^(CC0|Public domain|CC BY(?:-SA)?(?:-[1-4](?:\\.0)?)?)$', re.I)
          session = requests.Session()
          session.headers.update(HEADERS)

          def slugify(value):
              value = unicodedata.normalize('NFKD', value).encode('ascii', 'ignore').decode().lower()
              return re.sub(r'[^a-z0-9]+', '-', value).strip('-')[:90] or 'post'

          def clean(value):
              return re.sub(r'<[^>]+>', ' ', html.unescape(str(value or ''))).strip()

          def commons_image(title, body):
              words = re.findall(r'[A-Za-z0-9]{3,}', title)
              # Try the complete post title first, then narrower topic searches.
              queries = [title, ' '.join(words[:7]), ' '.join(words[:5]) + ' music', ' '.join(words[:5]) + ' record']
              seen = set()
              for query in queries:
                  query = query.strip()
                  if not query or query.lower() in seen:
                      continue
                  seen.add(query.lower())
                  params = {
                      'action': 'query', 'format': 'json', 'generator': 'search',
                      'gsrnamespace': 6, 'gsrsearch': query, 'gsrlimit': 40,
                      'prop': 'imageinfo', 'iiprop': 'url|extmetadata', 'iiurlwidth': 1600
                  }
                  try:
                      data = session.get(API, params=params, timeout=30).json()
                      pages = (data.get('query') or {}).get('pages') or {}
                      for page in pages.values():
                          info = (page.get('imageinfo') or [{}])[0]
                          meta = info.get('extmetadata') or {}
                          license_name = clean(meta.get('LicenseShortName', {}).get('value', ''))
                          if not ALLOWED.match(license_name):
                              continue
                          url = info.get('thumburl') or info.get('url')
                          if not url:
                              continue
                          response = session.get(url, timeout=45)
                          response.raise_for_status()
                          mime = response.headers.get('Content-Type', '').split(';')[0].lower()
                          extensions = {'image/jpeg': '.jpg', 'image/png': '.png', 'image/webp': '.webp', 'image/tiff': '.tif'}
                          ext = extensions.get(mime)
                          if not ext or len(response.content) < 5000:
                              continue
                          artist = clean(meta.get('Artist', {}).get('value', 'Unknown creator'))
                          object_name = clean(meta.get('ObjectName', {}).get('value', page.get('title', title)))
                          source = info.get('descriptionurl', '')
                          attribution = f'{object_name} — {artist}; {license_name}; {source}'
                          return response.content, ext, attribution
                  except Exception as exc:
                      print(f'Commons query failed ({query}): {exc}')
                  time.sleep(0.3)
              return None

          missing = []
          downloaded = 0
          for post in sorted((ROOT / 'posts').glob('*/*.md')):
              raw = post.read_text(encoding='utf-8')
              match = re.match(r'\\A---\\s*\\n(.*?)\\n---\\s*\\n', raw, re.S)
              if not match:
                  continue
              front = yaml.safe_load(match.group(1)) or {}
              images = front.get('images') or []
              if isinstance(images, str):
                  images = [images]
              current = str(images[0]) if images else ''
              # Preserve any real image already in place; replace generated SVG placeholders.
              if current and not current.lower().split('|', 1)[0].strip().endswith('.svg'):
                  continue
              title = str(front.get('title') or post.stem)
              result = commons_image(title, raw[match.end():])
              if not result:
                  missing.append(f'{post}: {title}')
                  print(f'NO REAL IMAGE FOUND: {post}')
                  continue
              content, ext, attribution = result
              number = post.name.split('-', 1)[0]
              filename = f'{number}-{slugify(title)}{ext}'
              target = MEDIA / filename
              target.write_bytes(content)
              image_value = f'media/{filename} | {attribution}'.replace('"', "'").replace('\\n', ' ')
              front_text = match.group(1)
              if re.search(r'(?m)^images:', front_text):
                  front_text = re.sub(r'(?ms)^images:.*?(?=^[^ \\t#][^\\n]*:|\\Z)', 'images:\\n  - "' + image_value + '"\\n', front_text)
              else:
                  front_text += '\\nimages:\\n  - "' + image_value + '"'
              updated = raw[:match.start(1)] + front_text.rstrip() + raw[match.end(1):]
              post.write_text(updated, encoding='utf-8')
              if current:
                  old_path = current.split('|', 1)[0].strip()
                  if old_path.startswith('media/') and old_path.lower().endswith('.svg'):
                      old_file = ROOT / old_path
                      if old_file.exists():
                          old_file.unlink()
              downloaded += 1
              print(f'DOWNLOADED {filename} for {post}')
              time.sleep(0.25)

          print(f'Real images downloaded: {downloaded}; posts still missing a real image: {len(missing)}')
          if missing:
              print('Posts requiring another image source:')
              for item in missing:
                  print(item)
              raise SystemExit(1)
          PY
      - name: Commit downloaded images and post metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts media
          if ! git diff --cached --quiet; then
            git commit -m "Replace placeholder art with sourced post images [skip ci]"
            git push origin main
          else
            echo "All posts already have real image files."
          fi
