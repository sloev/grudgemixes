name: Fill missing post images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - '.github/workflows/fill-post-images.yml'
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: write

concurrency:
  group: fill-post-images
  cancel-in-progress: false

jobs:
  images:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Find and add a properly licensed image to every post
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install requests pyyaml
          python <<'PY'
          import html, re, time, unicodedata
          from pathlib import Path
          from urllib.parse import quote
          import requests, yaml

          ROOT = Path('.')
          MEDIA = ROOT / 'media'
          MEDIA.mkdir(exist_ok=True)
          API = 'https://commons.wikimedia.org/w/api.php'
          HEADERS = {'User-Agent': 'SpiteFrequenciesImageBot/1.0 (GitHub Actions; public-domain-and-CC-only)'}
          BLOCK = re.compile(r'portrait|headshot|selfie|face|people|person|singer|musician|band photo|group photo|crowd|wedding|family', re.I)
          ALLOWED = re.compile(r'^(CC0|Public domain|CC BY(?:-SA)?(?:-[1-4](?:\.0)?)?)$', re.I)

          def slugify(value):
              value = unicodedata.normalize('NFKD', value).encode('ascii', 'ignore').decode().lower()
              return re.sub(r'[^a-z0-9]+', '-', value).strip('-')[:90] or 'post'

          def fallback_svg(title, number, path):
              safe = html.escape(title)
              words = title.split()
              lines, line = [], ''
              for word in words:
                  if len(line) + len(word) > 23 and line:
                      lines.append(line); line = word
                  else:
                      line = (line + ' ' + word).strip()
              if line: lines.append(line)
              lines = lines[:5]
              text = ''.join(f'<text x="70" y="{390+i*68}" font-family="Georgia,serif" font-size="48" fill="#f3ead8">{html.escape(v)}</text>' for i,v in enumerate(lines))
              svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
              <defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#171717"/><stop offset="1" stop-color="#60412e"/></linearGradient><pattern id="p" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#e4c9a4" opacity=".16"/></pattern></defs>
              <rect width="1200" height="900" fill="url(#g)"/><rect width="1200" height="900" fill="url(#p)"/>
              <circle cx="930" cy="280" r="205" fill="none" stroke="#c98e55" stroke-width="3" opacity=".8"/><circle cx="930" cy="280" r="168" fill="none" stroke="#c98e55" stroke-width="2" opacity=".55"/><circle cx="930" cy="280" r="18" fill="#c98e55"/>
              <path d="M0 700 L1200 470 M0 760 L1200 530 M0 820 L1200 590" stroke="#c98e55" opacity=".18" stroke-width="2"/>
              <text x="70" y="105" font-family="Arial,sans-serif" font-size="24" letter-spacing="8" fill="#c98e55">SPITE FREQUENCIES</text>{text}
              <text x="70" y="820" font-family="Arial,sans-serif" font-size="22" letter-spacing="5" fill="#d7c6ae">CATALOGUE {html.escape(number)}</text></svg>'''
              path.write_text(svg, encoding='utf-8')

          def commons_image(title):
              params = {'action':'query','format':'json','generator':'search','gsrnamespace':6,
                        'gsrsearch':title,'gsrlimit':12,'prop':'imageinfo',
                        'iiprop':'url|extmetadata','iiurlwidth':1400}
              try:
                  data = requests.get(API, params=params, headers=HEADERS, timeout=25).json()
                  pages = (data.get('query') or {}).get('pages') or {}
                  for page in pages.values():
                      info = (page.get('imageinfo') or [{}])[0]
                      meta = info.get('extmetadata') or {}
                      license_name = re.sub('<[^>]+>', '', meta.get('LicenseShortName',{}).get('value','')).strip()
                      if not ALLOWED.match(license_name): continue
                      description = re.sub('<[^>]+>', ' ', meta.get('ObjectName',{}).get('value',page.get('title','')))
                      if BLOCK.search(page.get('title','') + ' ' + description): continue
                      url = info.get('thumburl') or info.get('url')
                      if not url: continue
                      response = requests.get(url, headers=HEADERS, timeout=40)
                      response.raise_for_status()
                      ext = '.jpg' if 'jpeg' in response.headers.get('Content-Type','') else '.png'
                      author = re.sub('<[^>]+>', '', meta.get('Artist',{}).get('value','Unknown'))
                      source = info.get('descriptionurl','')
                      return response.content, ext, f'{description or title} — {author}; {license_name}; {source}'
              except Exception as exc:
                  print(f'Commons lookup failed for {title}: {exc}')
              return None

          changed = 0
          for post in sorted(list((ROOT/'posts').glob('*/*.md'))):
              raw = post.read_text(encoding='utf-8')
              match = re.match(r'\A---\s*\n(.*?)\n---\s*\n', raw, re.S)
              if not match: continue
              front = yaml.safe_load(match.group(1)) or {}
              if front.get('images'): continue
              title = str(front.get('title') or post.stem)
              number = post.name.split('-',1)[0]
              found = commons_image(title)
              if found:
                  content, ext, caption = found
                  filename = f'{number}-{slugify(title)}{ext}'
                  (MEDIA/filename).write_bytes(content)
              else:
                  filename = f'{number}-{slugify(title)}.svg'
                  fallback_svg(title, number, MEDIA/filename)
                  caption = f'Original typographic cover artwork for {title}'
              image_value = ("media/" + filename) + " | " + caption.replace('"', "'").replace("\n", " ")
              new_front = re.sub(r'(?m)^images:\s*\[\]\s*$', 'images:\n  - "' + image_value + '"', match.group(1)).rstrip()
              updated = raw[:match.start(1)] + new_front + raw[match.end(1):]
              post.write_text(updated, encoding='utf-8')
              changed += 1
              print(f'Added {filename} to {post}')
              time.sleep(0.15)
          print(f'Posts given images: {changed}')
          PY
      - name: Commit images and post metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts media
          if ! git diff --cached --quiet; then
            git commit -m "Add images to every post [skip ci]"
            git push origin main
          else
            echo "Every post already has an image."
          fi
