name: Publish public research tracker
on:
  push:
    branches: [main]
    paths:
      - 'candidates/**'
      - 'research/**'
      - 'leads/**'
      - 'projects/**'
      - 'scripts/build_public_status.py'
      - 'public/**'
      - '.github/workflows/publish-public-tracker.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: read
concurrency:
  group: publish-public-tracker
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build sanitized feed
        run: python3 scripts/build_public_status.py
      - name: Push static site to public repository
        env:
          PUBLIC_SITE_TOKEN: ${{ secrets.PUBLIC_SITE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$PUBLIC_SITE_TOKEN" ]; then
            echo "::error::Add PUBLIC_SITE_TOKEN with Contents write access to sloev/grudgemusic-public."
            exit 1
          fi
          git clone --depth 1 "https://x-access-token:${PUBLIC_SITE_TOKEN}@github.com/sloev/grudgemusic-public.git" public-repo
          cp public/index.html public/data.json public-repo/
          cd public-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data.json
          if git diff --cached --quiet; then echo "No public changes."; exit 0; fi
          git commit -m "Publish research tracker"
          git push origin HEAD:main
