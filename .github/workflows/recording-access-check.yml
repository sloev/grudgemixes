name: Enforce recording listening links

on:
  push:
    branches: [main]
    paths:
      - 'posts/_recordings/**'
      - 'posts/_mixtapes/**'
      - 'scripts/check_recording_access.py'
      - 'scripts/sync_recording_publication.py'
      - '.github/workflows/recording-access-check.yml'
      - '_layouts/recording.html'
      - '_config.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recording-publication-check
  cancel-in-progress: true

jobs:
  listening-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml
      - name: Keep unfinished or unlistenable entries out of the public build
        run: python scripts/sync_recording_publication.py
      - name: Commit publication exclusions to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _config.yml
          if ! git diff --cached --quiet; then
            git commit -m "Keep unfinished recordings out of public catalogue"
            git push origin main
          fi
      - name: Require a listening URL or approved embed for every published recording
        run: python scripts/check_recording_access.py
      - name: Save publication and link audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recording-publication-audit
          path: |
            unready-publication-items.txt
            missing-recording-links.txt
          if-no-files-found: ignore
