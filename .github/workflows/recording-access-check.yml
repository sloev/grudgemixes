name: Enforce recording listening links

on:
  push:
    branches: [main]
    paths:
      - 'posts/_recordings/**'
      - 'scripts/check_recording_access.py'
      - '.github/workflows/recording-access-check.yml'
      - '_layouts/recording.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  listening-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml
      - name: Require a recording-specific listening URL or approved embed
        run: python scripts/check_recording_access.py
      - name: Save the audit report even when the check fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: missing-recording-links
          path: missing-recording-links.txt
          if-no-files-found: ignore
