name: Publish encrypted follow-along site
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install markdown cryptography
      - name: Build
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: python3 scripts/build_site.py --out /tmp/site
      - name: Push to sloev/grudgemusic-public
        env:
          TOKEN: ${{ secrets.PUBLIC_SITE_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/sloev/grudgemusic-public.git" /tmp/pub
          cd /tmp/pub
          git rm -rq --ignore-unmatch . 
          cp -a /tmp/site/. .
          git add -A
          git -c user.name="site-bot" -c user.email="site-bot@users.noreply.github.com" commit -qm "Update encrypted site from ${GITHUB_SHA::7}" || exit 0
          git push -q origin HEAD
