<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4efe6">
  <title>{% if page.title %}{{ page.title | escape }} — {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.summary | default: page.description | default: site.description | strip_html | escape }}">
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | absolute_url }}">
  {% seo %}
</head>
<body>
  <main class="page-shell">{{ content }}</main>
  <script>
  (function () {
    var roots = document.querySelectorAll('.prose p');
    roots.forEach(function (root) {
      var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
        acceptNode: function (node) {
          return node.parentElement && node.parentElement.closest('a, code, pre') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT;
        }
      });
      var nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      nodes.forEach(function (node) {
        node.nodeValue = node.nodeValue.replace(/\.(\s+)(?=[A-Z“"'(])/g, '.\n');
      });
    });
  })();
  </script>
</body>
</html>
