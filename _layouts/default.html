<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% if page.title %}{{ page.title | escape }} — {% endif %}{{ site.title | escape }}</title><meta name="description" content="{{ page.summary | default: site.description | strip_html | escape }}"><link rel="stylesheet" href="{{ '/style.css' | relative_url }}">{% feed_meta %}</head><body><header class="site-header"><a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a><p>{{ site.description }}</p><nav><a href="{{ '/' | relative_url }}">Recordings</a> · <a href="{{ '/mixtapes/' | relative_url }}">Mixtapes</a> · <a href="{{ '/feed.xml' | relative_url }}">RSS</a></nav></header><main>{{ content }}</main><footer>{{ site.title }}</footer></body></html>
